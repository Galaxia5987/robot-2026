def fetchFile(String file, String commitHash, File tempCloneDir, File targetDir){
    def sourceFile = new File(tempCloneDir, "analyze/$file")
    if (!sourceFile.exists()) {
        logger.lifecycle("$file not found, skipping")
        return
    }

    def targetFile = new File(targetDir, file)

    // Read original content
    def originalContent = sourceFile.getText("UTF-8")

    // Prepend commit hash comment
    def newContent = """// Commit: ${commitHash}

${originalContent}"""

    targetFile.write(newContent, "UTF-8")

    logger.lifecycle("$file synced successfully (commit ${commitHash})")

}

tasks.register("fetchShotCalculator") {
    description = "Fetch ShotCalculator.java from private repo if accessible"
    group = "build setup"

    doLast {
        def tempCloneDir = file("$buildDir/tmp/shotcalculator-repo")
        def targetDir = file("src/main/kotlin/frc/robot")
        targetDir.mkdirs()

        // Clean previous clone
        if (tempCloneDir.exists()) {
            tempCloneDir.deleteDir()
        }

        try {
            // Clone repo quietly
            exec {
                commandLine(
                        "git",
                        "clone",
                        "--depth",
                        "1",
                        "https://github.com/Galaxia5987/ballistic-simulator",
                        tempCloneDir.absolutePath
                )
                environment "GIT_TERMINAL_PROMPT", "0"
                ignoreExitValue = true
            }

            logger.lifecycle("Cloned repo")

            // Get commit hash
            def commitHash = "unknown"
            try {
                def stdout = new ByteArrayOutputStream()
                exec {
                    workingDir tempCloneDir
                    commandLine "git", "rev-parse", "--short", "HEAD"
                    standardOutput = stdout
                }
                commitHash = stdout.toString().trim()
            } catch (Exception ignored) {
            }

            // Remove .git to avoid IDE confusion
            def gitDir = new File(tempCloneDir, ".git")
            if (gitDir.exists()) {
                gitDir.deleteDir()
            }

            fetchFile("ShotCalculator.java", commitHash, tempCloneDir, targetDir)
            fetchFile("FeedingShotCalculator.java", commitHash, tempCloneDir, targetDir)


        } catch (Exception e) {
            logger.lifecycle("Skipping ShotCalculator sync: ${e.message}")
        }
    }
}
